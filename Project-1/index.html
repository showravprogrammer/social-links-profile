<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Css Dropdown Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Dropdown Content Practice</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Maxime aliquid
      incidunt exercitationem ex non et ipsam mollitia quod sapiente. Vero.
    </p>

    <div class="dropdown" style="float: left">
      <button class="dropbtn">Left</button>
      <div class="dropdown-content" style="left: 0">
        <a href="">Link 1</a>
        <a href="">Link 2</a>
        <a href="">Link 3</a>
      </div>
    </div>

    <div class="dropdown" style="float: right">
      <button class="dropbtn">right</button>
      <div class="dropdown-content" id="content" style="right: 0">
        <a href="">Link 1</a>
        <a href="">Link 2</a>
        <a href="">Link 3</a>
      </div>
    </div>

  </body>
</html>
