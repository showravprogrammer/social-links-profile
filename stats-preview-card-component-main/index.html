<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Stats preview card component</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="div_container">
        <div class="text_content">
          <h1>Get <span>insights</span> that help  your business grow.</h1>
          <p>
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>
          <div class="stats">
            <div class="stats_item">
              <span class="stats_number">10k+</span>
              <span class="stats_label">companies</span>
            </div>
            <div class="stats_item">
              <span class="stats_number"> 314</span>
              <span class="stats_label">templates</span>
            </div>
            <div class="stats_item">
              <span class="stats_number">12m+ </span>
              <span class="stats_label">queries</span>
            </div>
          </div>
        </div>
        <div class="image_container">
          <img src="images/image-header-desktop.jpg" alt="">
          <div class="color_content">

          </div>
        </div>
      </div>
    </div>
  </body>
</html>
